[project]
name = "resolveai"
version = "0.1.0"
description = "AI incident investigation copilot built with synthetic data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "openai>=2.0.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.13.4",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.52.1",
    "typesafe-sdk>=0.7.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
target-version = "py313"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: requires a real PostgreSQL database",
]
