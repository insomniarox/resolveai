services:
  database:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: resolveai
      POSTGRES_USER: resolveai
      POSTGRES_PASSWORD: resolveai
    ports:
      - "5432:5432"
    volumes:
      - resolveai_postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

  api:
    build:
      context: .
    environment:
      # Compose service names are DNS names on the shared default network.
      DATABASE_URL: postgresql://resolveai:resolveai@database:5432/resolveai
      RESOLVEAI_RUNTIME_PROVIDER: ${RESOLVEAI_RUNTIME_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - database

  web:
    build:
      context: ./web
      args:
        RESOLVEAI_API_URL: http://api:8000
    environment:
      # Keep startup configuration consistent with the build-time rewrite.
      RESOLVEAI_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  resolveai_postgres_data:
